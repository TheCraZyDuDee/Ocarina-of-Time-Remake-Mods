name: Verify mods

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test IPS32 source, docs and regression hashes
        run: python3 -m unittest discover -s tests -v
      - name: Rebuild ZIPs
        run: python3 mods/fps/build.py --output-dir dist
      - name: Verify packaged ZIPs reproduce exactly
        run: |
          for name in oot-fixed-30-both-builds.zip oot-adaptive-both-builds.zip oot-variable-both-builds.zip; do
            cmp "dist/$name" "releases/$name"
          done
      - name: Check for prohibited file extensions
        run: |
          if git ls-files | grep -Ei '(\.nso$|\.nca$|\.nsp$|\.xci$|\.keys$|(^|/)main\([0-9]+\)$|(^|/)eden_log.*\.txt$)'; then
            echo "Proprietary dump detected" >&2
            exit 1
          fi
