name: Verify mods

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test IPS32 source and release regressions
        run: python3 -m unittest discover -s tests -v
      - name: Rebuild downloadable ZIPs
        run: python3 mods/fps/build.py --output-dir dist
      - name: Verify exact published ZIPs
        run: |
          for name in oot-fixed-30-both-builds.zip oot-adaptive-both-builds.zip oot-true-dynamic-e0f3.zip; do
            cmp "dist/$name" "releases/$name"
          done
      - name: Reject proprietary input files
        run: |
          if git ls-files | grep -Ei '(\.nso$|\.nca$|\.nsp$|\.xci$|\.keys$|(^|/)main\([0-9]+\)$|(^|/)eden_log.*\.txt$)'; then
            echo "Proprietary dump detected" >&2
            exit 1
          fi

  audit-dynamic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional ARM64 audit dependency
        run: python3 -m pip install unicorn==2.1.4
      - name: Execute published True Dynamic helper
        run: python3 tools/audit_dynamic.py -v
